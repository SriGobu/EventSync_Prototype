<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout use safe-area padding (notch / home bar) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3F7BAB" />

    <!-- Browser / tab icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- iOS "Add to Home Screen" -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EventSync" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- Page Title -->
    <title>EventSync — Organize college events without the coordination chaos</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="EventSync brings hosts and class teachers together in one calm workspace, so every event gets the right students, right on time."
    />
    <link rel="canonical" href="https://event-sync-prototype.onrender.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="EventSync" />
    <meta
      property="og:title"
      content="EventSync — Organize college events without the coordination chaos"
    />
    <meta
      property="og:description"
      content="One calm workspace for hosts and class teachers, so every event gets the right students, right on time."
    />
    <meta
      property="og:image"
      content="https://event-sync-prototype.onrender.com/previewLogo.png"
    />
    <meta
      property="og:image:alt"
      content="EventSync — campus events, in sync"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://event-sync-prototype.onrender.com/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="EventSync — Organize college events without the coordination chaos"
    />
    <meta
      name="twitter:description"
      content="One calm workspace for hosts and class teachers, so every event gets the right students, right on time."
    />
    <meta
      name="twitter:image"
      content="https://event-sync-prototype.onrender.com/previewLogo.png"
    />
    <meta
      name="twitter:image:alt"
      content="EventSync — campus events, in sync"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
